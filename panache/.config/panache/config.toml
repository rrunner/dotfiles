[format]
wrap = "reflow"
line-width = 150
line-ending = "auto"
horizontal-rule-style = "line-width"
math = "reflow"
math-delimiter-style = "preserve"
math-indent = 2

[formatters]
python = "ruff"
r = "air"
sql = "my_sqlfluff"
json = "prettier"

[formatters.my_sqlfluff]
cmd = "sqlfluff"
args = ["fix", "--dialect=ansi", "--rules=CP01,CV01", "-"]

[lint]
extend-select = [
  "heading-strip-comments-residue",
  "quarto-schema-unknown-key",
]

[linters]
python = "ruff"
r = "jarl"

[linters.jarl]
append-args = ["--select", "ALL"]

[extensions]
hard-line-breaks = false
citations = true
task-lists = true
emoji = true
