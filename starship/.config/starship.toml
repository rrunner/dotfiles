"$schema" = "https://starship.rs/config-schema.json"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$pixi\
$python\
$rlang\
$character"""

[directory]
style = "blue"

[character]
disabled = false
format = "$symbol "
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
# vicmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
stashed = "≡"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
conflicted = "="
deleted = "✘"
renamed = "»"
modified = "!"
staged = "+"
untracked = "?"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
# style = "bright-black"
detect_extensions = []  # don't trigger for .py files only
python_binary = ["python", ".pixi/envs/default/bin/python"]  # resolves inside `pixi shell` via PATH, otherwise falls back to the local env

[rlang]
symbol = "ﳒ"
format = "[$symbol ($version )]($style)"
# detect_files = ['.Rprofile', '.Renviron']
# detect_folders = ['r', 'R']
detect_extensions = [".R"]

[pixi]
symbol = "🧚 "
show_default_environment = false
format = '[$symbol( $project_name)(\( $environment\))]($style) '
detect_files = ["pixi.toml", "pixi.lock"]
