[tools]
"aqua:jolars/panache" = "latest"
"aqua:nushell/nushell" = "latest"
"aqua:sqls-server/sqls" = "latest"
bat = "latest"
"conda:air" = "latest"
"conda:jarl" = "latest"
delta = "latest"
expert = "latest"
fd = "latest"
"github:prefix-dev/pixi" = "latest"
harper-ls = "latest"
hlint = "latest"
jq = "latest"
lua-language-server = "latest"
markdownlint-cli2 = "latest"
node = "26"
"npm:@prantlf/jsonlint" = "latest"
"npm:bash-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:markdown-toc" = "latest"
"npm:sql-formatter" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
ormolu = "latest"
prettier = "latest"
"pypi:debugpy" = "latest"
"pypi:sqlfluff" = "latest"
python = "3.14"
ruff = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"
ty = "latest"
uv = "latest"

[settings]
minimum_release_age = "3h"
cache_prune_age = "10d"
# applications managed by the system (pacman)
disable_tools = [
  "neovim",
  "ripgrep",
  "tree-sitter",
  "fzf",
  "elixir",
  "erlang",
]
