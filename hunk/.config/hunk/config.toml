# user specific hunk settings
# - project specific settings in .hunk/config.toml overrides
theme = "nord"
mode = "auto"
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = true
copy_decorations = false
cursor_line = "row"
animations = false
file_gap = 3
hunk_gap = 1
prompt_save_view_preferences = false

[keybindings]
"hunk.review.nextHunk" = ["]", "ctrl+n"]
"hunk.review.previousHunk" = ["[", "ctrl+p"]
"hunk.review.nextFile" = ";"
"hunk.review.previousFile" = ","
"hunk.view.toggleLineNumbers" = false
